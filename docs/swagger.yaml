host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
    url: http://www.example.com/support
  description: This is a sample server for currency exchange rates.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://example.com/terms/
  title: Currency API
  version: "1.0"
paths:
  /currency/{date}:
    get:
      consumes:
      - application/json
      description: Get currency exchange rate by date and optionally by code
      parameters:
      - description: Date
        in: path
        name: date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get currency by date and code
      tags:
      - getSavedData
  /currency/{date}/{code}:
    get:
      consumes:
      - application/json
      description: Get currency exchange rate by date and optionally by code
      parameters:
      - description: Date
        in: path
        name: date
        required: true
        type: string
      - description: Code
        in: path
        name: code
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get currency by date and code
      tags:
      - getSavedData
  /currency/save/{date}:
    get:
      consumes:
      - application/json
      description: Save currency by date
      parameters:
      - description: Date
        in: path
        name: date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Save currency by date
      tags:
      - downloadFromSource
swagger: "2.0"
